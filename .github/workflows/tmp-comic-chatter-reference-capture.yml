name: Temporary Comic Chatter reference capture

on:
  push:
    branches:
      - tmp-comic-chatter-reference-capture
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-comic-chatter-reference-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download public original references and source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p references source
          curl --fail --location --retry 4 --retry-all-errors \
            'https://dmcostello.com/wp-content/uploads/2016/08/Microsoft-Chat-2.5-1024x734.png' \
            -o references/Microsoft-Chat-2.5.png
          curl --fail --location --retry 4 --retry-all-errors \
            'https://dmcostello.com/wp-content/uploads/2016/08/GroupChat-1024x771.png' \
            -o references/GroupChat.png
          curl --fail --location --retry 4 --retry-all-errors \
            'https://www.pojoclan.com/comicchat/comicchat.JPG' \
            -o references/pojoclan-comicchat.jpg
          curl --fail --location --retry 4 --retry-all-errors \
            'https://mermeliz.com/files/summary/comic600.jpg' \
            -o references/comic600.jpg
          curl --fail --location --retry 4 --retry-all-errors \
            'https://github.com/microsoft/comic-chat/archive/refs/heads/main.zip' \
            -o source/comic-chat-main.zip
          sha256sum references/* source/* > SHA256SUMS.txt

      - name: Upload reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: comic-chatter-original-references-and-source
          path: |
            references/
            source/
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
