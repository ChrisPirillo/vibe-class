name: Temporary Comic Chatter reference capture

on:
  push:
    branches:
      - tmp-comic-chatter-reference-capture
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-comic-chatter-reference-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download public original references
        shell: bash
        run: |
          set -u
          mkdir -p references metrics source-notes
          fetch() {
            local url="$1" out="$2"
            echo "Fetching $url"
            curl --location --retry 5 --retry-delay 2 --retry-all-errors \
              --user-agent 'Mozilla/5.0 Comic Chatter visual parity research' \
              --connect-timeout 20 --max-time 90 \
              "$url" -o "references/$out"
            test -s "references/$out" || rm -f "references/$out"
          }
          fetch 'https://dmcostello.com/wp-content/uploads/2016/08/Microsoft-Chat-2.5-1024x734.png' 'Microsoft-Chat-2.5.png'
          fetch 'https://dmcostello.com/wp-content/uploads/2016/08/GroupChat-1024x771.png' 'GroupChat.png'
          fetch 'https://mermeliz.com/files/summary/comic600.jpg' 'comic600.jpg'
          find references -type f -size +0c -print
          test "$(find references -type f -size +0c | wc -l)" -ge 2
          sha256sum references/* > SHA256SUMS.txt

      - name: Extract historical Comic Sans metrics without publishing the font
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet fonttools
          curl --fail --location --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/microsoft/comic-chat/c59ce0d74ac6033799a51c9df813c0c356da048f/v1.0/shared/comic.ttf' \
            -o /tmp/comic.ttf
          python - <<'PY'
          from fontTools.ttLib import TTFont
          import json
          font=TTFont('/tmp/comic.ttf',lazy=False)
          upm=font['head'].unitsPerEm
          cmap={cp:name for table in font['cmap'].tables for cp,name in table.cmap.items()}
          hmtx=font['hmtx'].metrics
          chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,!?;:\'\"-()[]/@#%&'
          glyph_for={ch:cmap.get(ord(ch)) for ch in chars}
          advances={ch:round(hmtx[name][0]/upm,8) for ch,name in glyph_for.items() if name in hmtx}
          reverse={name:ch for ch,name in glyph_for.items() if name}
          kern={}
          if 'kern' in font:
              for table in font['kern'].kernTables:
                  for (left,right),value in table.kernTable.items():
                      a,b=reverse.get(left),reverse.get(right)
                      if a and b and value:
                          kern[a+b]=round(value/upm,8)
          names=[]
          for record in font['name'].names:
              if record.nameID in (1,2,4,6):
                  try: value=record.toUnicode()
                  except Exception: continue
                  item={'id':record.nameID,'value':value}
                  if item not in names: names.append(item)
          os2=font['OS/2']; hhea=font['hhea']
          payload={
            'source':'microsoft/comic-chat historical v1.0/shared/comic.ttf',
            'sourceCommit':'c59ce0d74ac6033799a51c9df813c0c356da048f',
            'unitsPerEm':upm,
            'names':names,
            'hhea':{'ascent':hhea.ascent/upm,'descent':hhea.descent/upm,'lineGap':hhea.lineGap/upm},
            'os2':{'typoAscender':os2.sTypoAscender/upm,'typoDescender':os2.sTypoDescender/upm,'typoLineGap':os2.sTypoLineGap/upm,'winAscent':os2.usWinAscent/upm,'winDescent':os2.usWinDescent/upm,'weightClass':os2.usWeightClass},
            'advancesEm':advances,
            'kernPairsEm':kern
          }
          open('metrics/comic-sans-ms-historical-metrics.json','w').write(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          rm -f /tmp/comic.ttf

      - name: Capture exact source font and compositor initialization snippets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            'https://github.com/microsoft/comic-chat/archive/refs/heads/main.zip' \
            -o /tmp/comic-chat-main.zip
          unzip -q /tmp/comic-chat-main.zip -d /tmp/comic-chat-source
          root="$(find /tmp/comic-chat-source -mindepth 1 -maxdepth 1 -type d | head -1)"
          {
            echo '== SetFonts and font-info assignments =='
            grep -R -n -E 'SetFonts\(|m_fiWNormal|m_fiWWhisper|m_fiShout|m_fiTitle' "$root/v2.5-beta-1" | head -200 || true
            echo
            echo '== Original panel and balloon constants =='
            grep -R -n -E 'MINUNITPANEL|ONELINETHRESHOLD|XBORDER|YBORDER|TOPBORDER|BORDERFUDGE|m_borderWidth' "$root/v2.5-beta-1" | head -200 || true
          } > source-notes/compositor-font-snippets.txt
          rm -rf /tmp/comic-chat-main.zip /tmp/comic-chat-source

      - name: Upload reference and metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: comic-chatter-original-references-and-metrics
          path: |
            references/
            metrics/
            source-notes/
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
